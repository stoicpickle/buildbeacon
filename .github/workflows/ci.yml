name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.x']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm pack --dry-run
      - name: Exercise the packaged CLI path
        shell: bash
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          node dist-cli/cli.js demo --out "$fixture_dir/receipt.json"
          node dist-cli/cli.js keygen --out "$fixture_dir/key.json"
          node dist-cli/cli.js create --input "$fixture_dir/receipt.json" --key "$fixture_dir/key.json" --out "$fixture_dir/receipt.bb"
          node dist-cli/cli.js verify --input "$fixture_dir/receipt.bb"
          node dist-cli/cli.js simulate --input "$fixture_dir/receipt.bb" --offset 73 --loss 0.30

  media-proof:
    name: Encoded pixel proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run demo:verify

  browser:
    name: Browser recovery and responsive layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
